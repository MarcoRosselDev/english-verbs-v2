name: CI

# Se ejecuta en cada push a main y en cada pull request
on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: este flujo solo necesita LEER el repositorio
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # guarda las dependencias entre ejecuciones para ir más rápido

      # npm ci instala EXACTAMENTE lo que dice package-lock.json (reproducible);
      # npm install podría actualizar versiones sin avisar.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm run build
        env:
          # Valores falsos: la compilación solo necesita que existan, no se conecta a nada.
          # Los secretos reales NUNCA se ponen aquí ni en el repositorio.
          DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
          AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789